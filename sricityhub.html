<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Sri City Support Hub | Jobs, Local Guidance & Community Network</title>
  <meta name="description" content="A trusted local support platform for private industrial jobs, interview assistance, verified stay, healthcare and navigation in Sri City, Tada and Sullurpeta." />
  
  <!-- Open Graph Metadata -->
  <meta property="og:title" content="Sri City Support Hub | Jobs & Local Support Ecosystem" />
  <meta property="og:description" content="Private industrial career listings, interview day help, verified stay and travel guidance in Sri City, Tada and Sullurpeta." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sricitysupporthub.vercel.app/sricityhub.html" />

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM & TOKENS (Eco-Industrial & Calm Professional)
       ========================================================================== */
    :root {
      --primary: #0e2433;          /* Deep Slate Navy */
      --primary-hover: #16364d;
      --forest: #1b4d3e;           /* Sri City Greenery / Calm Forest */
      --forest-soft: #eaf3ef;
      --forest-border: #c8dfd5;
      --accent: #b46b15;           /* Refined Amber Gold */
      --accent-soft: #fdf6ec;
      --bg: #f8fafc;               /* Slate Crisp Light */
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-subtle: #edf2f7;
      --text-main: #0f172a;        /* High Contrast Slate 900 */
      --text-muted: #475569;       /* Slate 600 */
      --text-light: #64748b;

      /* Status Badges */
      --badge-verified-bg: #dcfce7;
      --badge-verified-text: #166534;
      --badge-source-bg: #fef9c3;
      --badge-source-text: #854d0e;
      --badge-review-bg: #fee2e2;
      --badge-review-text: #991b1b;
      --badge-demo-bg: #e0e7ff;
      --badge-demo-text: #3730a3;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 10px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.08);

      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      width: 100%;
      overflow-x: hidden;
      padding-bottom: 72px; /* Space for mobile sticky dock */
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: color 0.15s ease;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 18px;
    }

    /* ==========================================================================
       2. HEADER & NAVIGATION
       ========================================================================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(14, 36, 51, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 66px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--forest), #2a7a5f);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .nav-desktop {
      display: none;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
    }

    .nav-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-link.accent-link {
      color: #fcd34d;
      background: rgba(252, 211, 77, 0.1);
    }

    .nav-link.accent-link:hover {
      background: rgba(252, 211, 77, 0.2);
    }

    .menu-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mobile Drawer */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 1100;
      backdrop-filter: blur(3px);
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: var(--surface);
      z-index: 1101;
      box-shadow: -6px 0 25px rgba(0, 0, 0, 0.15);
      transition: right 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-head {
      padding: 18px 20px;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .drawer-close {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
    }

    .drawer-body {
      overflow-y: auto;
      padding: 12px 0;
      flex: 1;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 22px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-subtle);
    }

    .drawer-item:hover {
      background: var(--surface-subtle);
      color: var(--forest);
    }

    /* ==========================================================================
       3. HERO SECTION (Compact, Fresh & Eco-Industrial)
       ========================================================================== */
    .hero {
      background: linear-gradient(180deg, #0e2433 0%, #153448 60%, #184136 100%);
      color: #ffffff;
      padding: 38px 0 46px;
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .hero-content {
      max-width: 780px;
      margin: 0 auto;
      text-align: center;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 30px;
      margin-bottom: 14px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .hero-pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }

    .hero-title {
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .hero-desc {
      font-size: 0.96rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 24px;
      padding: 0 8px;
    }

    /* Universal Search System */
    .search-container {
      max-width: 620px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
    }

    .search-input {
      flex: 1;
      border: none;
      padding: 14px 18px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      min-width: 0;
    }

    .search-btn {
      background: var(--forest);
      color: #ffffff;
      border: none;
      padding: 0 22px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: #153e32;
    }

    .search-feedback {
      display: none;
      margin-top: 14px;
      font-size: 0.82rem;
      background: rgba(0, 0, 0, 0.35);
      color: #fcd34d;
      padding: 6px 14px;
      border-radius: 20px;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .search-feedback button {
      background: none;
      border: none;
      color: #ffffff;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Primary Quick Action Chips (Clean & Calm) */
    .quick-dock {
      margin-top: -22px;
      position: relative;
      z-index: 10;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .dock-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .dock-card:hover {
      border-color: var(--forest);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .dock-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: var(--forest-soft);
      color: var(--forest);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .dock-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .dock-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       4. COMMON SECTION ARCHITECTURE
       ========================================================================== */
    section {
      padding: 48px 0;
    }

    .section-header {
      margin-bottom: 24px;
    }

    .section-kicker {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--forest);
      margin-bottom: 4px;
      display: block;
    }

    .section-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.3px;
      line-height: 1.25;
    }

    .section-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .card:hover {
      border-color: #cbd5e1;
    }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-verified { background: var(--badge-verified-bg); color: var(--badge-verified-text); }
    .badge-source { background: var(--badge-source-bg); color: var(--badge-source-text); }
    .badge-review { background: var(--badge-review-bg); color: var(--badge-review-text); }
    .badge-demo { background: var(--badge-demo-bg); color: var(--badge-demo-text); }

    /* Button Hierarchy */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      min-height: 40px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-forest {
      background: var(--forest);
      color: #ffffff;
    }

    .btn-forest:hover {
      background: #143e32;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--surface-subtle);
      border-color: #cbd5e1;
    }

    .btn-wa-subtle {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-weight: 700;
    }

    .btn-wa-subtle:hover {
      background: #dcfce7;
    }

    /* Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    /* Notice Disclaimers */
    .disclaimer-box {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: #78350f;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    /* ==========================================================================
       5. JOBS & CAREER SECTION
       ========================================================================== */
    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 30px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .filter-chip.active, .filter-chip:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .job-card {
      padding: 20px;
    }

    .job-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .job-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    .job-company {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .job-specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 12px;
      background: var(--surface-subtle);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.8rem;
      margin-bottom: 14px;
    }

    .job-spec-item strong {
      color: var(--text-main);
    }

    .job-spec-item span {
      color: var(--text-muted);
    }

    .job-collapsible {
      display: none;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px dashed var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .job-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
    }

    /* ==========================================================================
       6. INTERVIEW PREP & JOINING ACCORDIONS
       ========================================================================== */
    .qa-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .qa-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      overflow: hidden;
    }

    .qa-trigger {
      width: 100%;
      background: #ffffff;
      border: none;
      padding: 14px 18px;
      text-align: left;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .qa-trigger:hover {
      background: var(--surface-subtle);
    }

    .qa-icon {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-light);
      flex-shrink: 0;
    }

    .qa-content {
      display: none;
      padding: 14px 18px 18px;
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.6;
      border-top: 1px solid var(--border-subtle);
      background: #fafbfc;
    }

    /* ==========================================================================
       7. FORMS (Unified, Mobile-Safe, Touch-Friendly)
       ========================================================================== */
    .form-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px 20px;
      box-shadow: var(--shadow-sm);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(27, 77, 62, 0.1);
    }

    /* ==========================================================================
       8. FOOTER (Institutional & Grounded)
       ========================================================================== */
    .footer {
      background: var(--primary);
      color: #94a3b8;
      padding: 50px 0 30px;
      font-size: 0.84rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      margin-bottom: 36px;
    }

    .footer-heading {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 0.2px;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-link:hover {
      color: #ffffff;
    }

    .footer-bottom {
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      text-align: center;
      font-size: 0.76rem;
    }

    .creator-attribution {
      color: #64748b;
      font-size: 0.74rem;
      user-select: text;
    }

    /* =================================================
